<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#14183a">
  <title>WBS Survey</title>
  <meta name="description" content="The WBS student feedback survey, as a pixel-art game. Anonymous, about 4 minutes.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Pixelify+Sans:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <header id="hud" hidden>
      <div id="progress" aria-label="Progress"></div>
      <div class="hud-buttons">
        <button id="btn-voice" class="hud-btn" aria-label="Toggle voice" title="Voice">🔊</button>
        <button id="btn-music" class="hud-btn" aria-label="Toggle music" title="Music">🎵</button>
        <button id="btn-fast" class="hud-btn" aria-label="Toggle fast mode" title="Fast mode">⚡</button>
      </div>
    </header>
    <main id="stage" aria-live="polite">
      <div id="bg"></div>
      <div id="scenery"></div>
      <div id="actors"></div>
      <div id="fx"></div>
    </main>
    <section id="panel"></section>
  </div>
  <noscript>Please turn on JavaScript to play the WBS Survey.</noscript>
  <script src="js/data.js"></script>
  <script src="js/sprites.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
